<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Auditoría - FiscaliTrack</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container mt-5">

    <h1>
        Editar Auditoría
    </h1>

    <hr>


    <div class="mb-4">

        <h5>
            Vehículo fiscalizado
        </h5>

        <p>
            <strong>
                Patente:
            </strong>

            {{ auditoria.fiscalizacion.patente }}
        </p>


        {% if auditoria.fiscalizacion.fotografia %}

            <p>
                <strong>
                    Fotografía del vehículo:
                </strong>
            </p>

            <img
                src="{{ auditoria.fiscalizacion.fotografia.url }}"
                alt="Fotografía del vehículo"
                width="300"
                class="img-thumbnail"
            >

        {% else %}

            <p>
                Este vehículo no tiene fotografía registrada.
            </p>

        {% endif %}

    </div>


    <hr>


    <form method="POST">

        {% csrf_token %}


        <div class="mb-3">

            <label class="form-label">
                Usuario
            </label>

            <input
                type="text"
                name="usuario"
                class="form-control"
                value="{{ auditoria.usuario }}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Acción
            </label>

            <input
                type="text"
                name="accion"
                class="form-control"
                value="{{ auditoria.accion }}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Descripción
            </label>

            <textarea
                name="descripcion"
                class="form-control"
                required
            >{{ auditoria.descripcion }}</textarea>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Guardar cambios
        </button>


        <a
            href="/auditoria/"
            class="btn btn-secondary"
        >
            Volver
        </a>


    </form>


</div>

</body>

</html>
